name: JMeter Load Test

on:
  push:
    paths:
      - 'jmeter/**'
      - '.github/workflows/jmeter.yml'
  pull_request:
    paths:
      - 'jmeter/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: jmeter

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install JMeter
        run: |
          JMETER_VERSION=5.6.3
          wget -q "https://dlcdn.apache.org//jmeter/binaries/apache-jmeter-${JMETER_VERSION}.tgz"
          tar -xzf "apache-jmeter-${JMETER_VERSION}.tgz"
          echo "JMETER_HOME=$PWD/apache-jmeter-${JMETER_VERSION}" >> "$GITHUB_ENV"

      - name: Run JMeter load test (headless)
        run: |
          "$JMETER_HOME/bin/jmeter" -n -t pokeapi-load-test.jmx -l results.jtl -e -o report/

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-report
          path: jmeter/report/
